theme: osuny
_merge: deep
# Pas de page single ("show") pour les entrées projects (repository) :
# seules les pages de liste (kind: page uniquement, la section /repository/ est conservée)
cascade:
  - _target:
      path: "/projects/**"
      kind: page
    outputs:
      - RSS # pas de HTML -> pas de page single, mais l'entrée reste dans toutes les listes (section + taxonomies)
  # Sous-page conteneur de données HR map (bloc files avec le CSV) : elle doit rester publiée
  # dans le CMS (le sync git Osuny ne génère que les pages publiées) pour que hr-map/build.js
  # puisse lire le CSV, mais Hugo ne doit jamais la rendre ni la lister.
  # NB : clé "build" (et non "_build", supprimée dans Hugo >= 0.145) ; path exact pour ne
  # pas toucher la page parente /hr-genealogies/ qui, elle, doit être rendue.
  - _target:
      path: "/pages/hr-genealogies/hr-map-data"
    build:
      render: never
      list: never
params:
  additional_csp: "img.youtube.com www.youtube-nocookie.com"
  image_sizes:
    blocks:
      chapter:
        # Variantes plus grandes : les images de blocs chapter sont affichées jusqu'à
        # 75% de la colonne (ex. About Us), soit > 448px en grand écran — l'ancien
        # réglage 448px du thème faisait upscale l'image par le navigateur (pixelisé).
        mobile: 350
        tablet: 800
        desktop: 1200
  summary:
    position: hero
  search:
    active: true
  logo:
    header: '/assets/images/nous-slogan-logo.svg'
    footer: ''
  home:
    head:
      title: site
  page:
    single:
      summary:
        position: content
  posts:
    index:
      layout: highlight
      taxonomies:
        display: false
      options:
        author: true
        categories: true
        date: false
        image: true
        reading_time: false
        summary: false
        subtitle: false
        with_more: true
  exhibitions:
      index:
        taxonomies:
          display: false
  projects:
    index:
      truncate_description: 0 # 0 = pas de troncature, le summary s'affiche en entier