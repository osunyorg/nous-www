theme: osuny
_merge: deep
# Pas de page single ("show") pour les entrées projects (repository) :
# seules les pages de liste (kind: page uniquement, la section /repository/ est conservée)
cascade:
  - _target:
      path: "/projects/**"
      kind: page
    outputs:
      - RSS # pas de HTML -> pas de page single, mais l'entrée reste dans toutes les listes (section + taxonomies)
  # Page de données HR map (bloc datatable importé via API, scripts/import-osuny/import-hr-map.rb) :
  # publiée car le sync git Osuny ne génère que les contenus publiés, mais jamais rendue ni listée —
  # ses données sont lues au build pour générer static/hr-map.json
  - _target:
      path: "/pages/hr-genealogies/hr-map-data/**"
    _build:
      render: never
      list: never
params:
  additional_csp: "img.youtube.com www.youtube-nocookie.com"
  summary:
    position: hero
  search:
    active: true
  logo:
    header: '/assets/images/nous-slogan-logo.svg'
    footer: ''
  home:
    head:
      title: site
  page:
    single:
      summary:
        position: content
  posts:
    index:
      layout: highlight
      taxonomies:
        display: false
      options:
        author: true
        categories: true
        date: false
        image: true
        reading_time: false
        summary: false
        subtitle: false
        with_more: true
  exhibitions:
      index:
        taxonomies:
          display: false
  projects:
    index:
      truncate_description: 0 # 0 = pas de troncature, le summary s'affiche en entier